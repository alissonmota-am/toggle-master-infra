name: Terraform Dev - Addons

on:
  push:
    branches: [develop]
    paths:
      - 'addons/**'
      - 'modules/argocd/**'
      - 'modules/ingress_nginx/**'
      - 'modules/metrics_server/**'
  pull_request:
    branches: [develop]
    paths:
      - 'addons/**'
      - 'modules/argocd/**'
      - 'modules/ingress_nginx/**'
      - 'modules/metrics_server/**'
  workflow_dispatch:

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

jobs:
  plan:
    name: Terraform Plan (dev)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: addons

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Terraform Init
        run: terraform init -backend-config="key=addons/dev/terraform.tfstate"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -var-file=environments/dev.tfvars -out=tfplan

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-addons-dev
          path: addons/tfplan

  apply:
    name: Terraform Apply (dev)
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'push'
    defaults:
      run:
        working-directory: addons

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-addons-dev
          path: addons

      - name: Terraform Init
        run: terraform init -backend-config="key=addons/dev/terraform.tfstate"

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
