name: Terraform Dev - Addons

on:
  push:
    branches: [develop]
    paths:
      - 'addons/**'
  pull_request:
    branches: [develop]
    paths:
      - 'addons/**'
  workflow_dispatch:

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  TF_VAR_grafana_admin_password: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
  TF_VAR_new_relic_license_key: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
  TF_VAR_slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
  TF_VAR_pagerduty_routing_key: ${{ secrets.PAGERDUTY_ROUTING_KEY }}

jobs:
  plan:
    name: Terraform Plan (dev)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: addons

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.0

      - name: Terraform Init
        run: terraform init -backend-config="key=addons/dev/terraform.tfstate"

      - name: Terraform Validate
        run: terraform validate

      - name: Configurar kubectl
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name toggle-master-dev
        continue-on-error: true

      - name: Instalar Helm CLI
        run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        continue-on-error: true

      - name: Helm cleanup (remove releases com estado pendente)
        run: |
          helm uninstall kube-prometheus-stack -n observability 2>/dev/null || true
          helm uninstall loki-stack -n observability 2>/dev/null || true
        continue-on-error: true

      - name: Terraform State Cleanup
        run: |
          terraform state rm module.observability.kubernetes_secret.alertmanager_config 2>/dev/null || true
          terraform state rm module.observability.kubernetes_deployment.otel_collector 2>/dev/null || true
          terraform state rm module.observability.helm_release.kube_prometheus_stack 2>/dev/null || true
          terraform state rm module.observability.helm_release.loki_stack 2>/dev/null || true
        continue-on-error: true

      - name: Terraform Plan
        run: terraform plan -var-file=environments/dev.tfvars -out=tfplan

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-addons-dev
          path: addons/tfplan

  apply:
    name: Terraform Apply (dev)
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: addons

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.0

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-addons-dev
          path: addons

      - name: Terraform Init
        run: terraform init -backend-config="key=addons/dev/terraform.tfstate"

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
